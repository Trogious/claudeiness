name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Package
        run: 7z a claudeiness-macos-arm64.7z claudeiness

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: claudeiness-macos-arm64.7z
          generate_release_notes: true
